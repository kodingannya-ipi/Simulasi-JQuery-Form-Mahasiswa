<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran Workshop Web Programming</title>
  <link rel="stylesheet" href="style-form.css">
  <link rel="stylesheet" href="style-kartu.css">
</head>
<body>

  <div class="container">
    <!--judul-->
    <h1>Workshop Web Programming</h1>
    <p>Isi data di bawah ini untuk mendaftar.</p>
    <!--formulir pendaftaran-->
    <form id="formDaftar" novalidate>
      <label for="nama">Nama Lengkap</label>
      <input type="text" id="nama" placeholder="Contoh: Budi Santoso">
      <span class="pesan-error" id="errorNama"></span>
      <label for="email">Email</label>
      <input type="text" id="email" placeholder="Contoh: budi@email.com">
      <span class="pesan-error" id="errorEmail"></span>
      <label for="hp">No HP</label>
      <input type="text" id="hp" placeholder="Contoh: 081234567890">
      <span class="pesan-error" id="errorHp"></span>
      <!--sesi workshop -->
      <label for="sesi">Pilih Sesi</label>
      <select id="sesi">
        <option value="">-- Pilih sesi --</option>
        <option value="Sesi 1 (Pagi, 08.00 - 10.00)">Sesi 1 (Pagi, 08.00 - 10.00)</option>
        <option value="Sesi 2 (Siang, 11.00 - 13.00)">Sesi 2 (Siang, 11.00 - 13.00)</option>
        <option value="Sesi 3 (Sore, 14.00 - 16.00)">Sesi 3 (Sore, 14.00 - 16.00)</option>
      </select>
      <span class="pesan-error" id="errorSesi"></span>
      <button type="submit">Daftar Sekarang</button>
    </form>

    <!--kartu konfrimasi ada disni, nanti diisi js-->
    <div id="kartu"></div>
  </div>

  <script src="validasi.js"></script>
  <script src="kartu.js"></script>
</body>
</html>
